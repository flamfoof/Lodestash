[workspace]
members = [
    "crates/lodestash-core",
    "crates/lodestash-ingest",
    "crates/lodestash-ai",
    "crates/lodestash-mcp",
    "crates/lodestash-api",
    "crates/lodestash-ui",
    "crates/lodestash-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["flamfoof"]
license = "MIT"
repository = "https://github.com/flamfoof/Lodestash"
rust-version = "1.80"

# Shared dependency versions — reference with `{ workspace = true }` in member crates.
[workspace.dependencies]
# Serialization
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"

# Error handling / logging
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Async / concurrency
tokio = { version = "1", features = ["full"] }
rayon = "1"

# Utilities
uuid  = { version = "1", features = ["v4", "serde"] }
blake3 = "1"

# Catalog / storage
rusqlite = { version = "0.32", features = ["bundled", "blob", "load_extension"] }

# Ingest
walkdir    = "2"
notify     = { version = "7", features = ["serde"] }
image      = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif"] }
flate2     = "1"
tar        = "0.4"
serde_yaml = "0.9"

# UI
eframe = { version = "0.29", features = ["wgpu"] }
egui   = "0.29"
rfd    = "0.15"
dirs   = "5"

# Testing
tempfile = "3"
insta    = "1"
proptest = "1"

# Inter-crate deps (workspace members)
lodestash-core   = { path = "crates/lodestash-core" }
lodestash-ingest = { path = "crates/lodestash-ingest" }
lodestash-ai     = { path = "crates/lodestash-ai" }
lodestash-mcp    = { path = "crates/lodestash-mcp" }
lodestash-api    = { path = "crates/lodestash-api" }
lodestash-ui     = { path = "crates/lodestash-ui" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

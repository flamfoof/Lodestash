[workspace]
members = [
    "crates/lodestash-core",
    "crates/lodestash-ingest",
    "crates/lodestash-ai",
    "crates/lodestash-mcp",
    "crates/lodestash-api",
    "crates/lodestash-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["flamfoof"]
license = "MIT"
repository = "https://github.com/flamfoof/Lodestash"
rust-version = "1.80"

# Shared dependency versions — reference with `{ workspace = true }` in member crates.
[workspace.dependencies]
# Serialization
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"

# Error handling / logging
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Async / concurrency
tokio = { version = "1", features = ["full"] }
rayon = "1"

# Utilities
uuid  = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
# FBX import for the 3D viewport (TECH-STACK §7): single-file C lib via cc — no cmake/libclang.
ufbx = "0.11"

# Catalog / storage
rusqlite = { version = "0.32", features = ["bundled", "blob", "load_extension"] }

# Model manager (P4) — blocking HTTP download of ONNX models on a worker thread + unzip the
# ONNX Runtime release archive to extract onnxruntime.dll.
ureq       = { version = "2", features = ["tls"] }
zip        = { version = "2", default-features = false, features = ["deflate"] }

# Ingest
walkdir    = "2"
notify     = { version = "7", features = ["serde"] }
image      = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif", "tga"] }
image_dds  = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
psd        = "0.3"
flate2     = "1"
tar        = "0.4"
serde_yaml = "0.9"

# Agent plane (ENGINE-API) — loopback HTTP/JSON server + the MCP control plane.
axum       = "0.8"
rmcp       = { version = "2.2", features = ["server", "macros", "transport-io", "schemars"] }
schemars   = "1"
base64     = "0.22"
tower      = { version = "0.5", features = ["util"] }

# UI
# eframe runs the Glow renderer (TECH-STACK §7) — the wgpu backend is not compiled.
eframe = "0.29"
egui   = "0.29"
rfd    = "0.15"
dirs   = "5"

# 3D viewport — three-d 0.18 shares eframe 0.29's GL context (both pin glow 0.14;
# upgrade the two together — TECH-STACK §7). default-features off: no window/glutin.
three-d       = { version = "0.18.2", default-features = false }
# data-url: self-contained .gltf files embed their buffers as base64 data URIs — without this
# feature they fail to load (in the viewer as well as the embedding renderer).
three-d-asset = { version = "0.9", features = ["gltf", "obj", "png", "jpeg", "tga", "data-url"] }
# Audio playback + decode (rodio bundles symphonia): wav/flac/vorbis/mp3.
rodio = "0.20"
# SVG nav-icon rendering (resvg via the svg feature); tinted per row state.
egui_extras = { version = "0.29", default-features = false, features = ["svg"] }

# Testing
tempfile = "3"
insta    = "1"
proptest = "1"

# Inter-crate deps (workspace members)
lodestash-core   = { path = "crates/lodestash-core" }
lodestash-ingest = { path = "crates/lodestash-ingest" }
lodestash-ai     = { path = "crates/lodestash-ai" }
lodestash-mcp    = { path = "crates/lodestash-mcp" }
lodestash-api    = { path = "crates/lodestash-api" }
lodestash-ui     = { path = "crates/lodestash-ui" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

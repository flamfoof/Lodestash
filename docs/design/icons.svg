    </symbol>
    <symbol id="ls-nav-collections" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7.5 a1.5 1.5 0 0 1 1.5-1.5 H9 l2 2 h7 a1.5 1.5 0 0 1 1.5 1.5 V17 a1.5 1.5 0 0 1-1.5 1.5 H4.5 A1.5 1.5 0 0 1 3 17 Z"/>

      <path d="M12 7 l1.3 3 3.2.3 -2.4 2.2 .7 3.2 -2.8-1.7 -2.8 1.7 .7-3.2 -2.4-2.2 3.2-.3 Z" fill="currentColor" stroke="none"/>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lodestash icon sprite.
  Usage: <svg class="icon"><use href="icons.svg#ls-search"/></svg>
  Style: 24x24, stroke=currentColor, stroke-width 1.75, round caps/joins, no fill unless noted.
  Theme: clean line icons with a faint gem/diamond motif (JRPG inventory flavor).
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

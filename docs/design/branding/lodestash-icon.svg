<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Lodestash">
  <!-- Lodestash app mark: the lodestone "guiding star" (gold) on a dark JRPG tile. -->
  <defs>
    <linearGradient id="bg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20283A"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="244" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#E7B765" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E7B765" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="256" y1="96" x2="256" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7B0"/>
      <stop offset="0.5" stop-color="#E7B765"/>
      <stop offset="1" stop-color="#C28C36"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="244" r="210" fill="url(#glow)"/>
    <circle cx="256" cy="256" r="188" fill="none" stroke="#E7B765" stroke-opacity="0.28" stroke-width="5"/>
    <path d="M256 96 L288 224 L416 256 L288 288 L256 416 L224 288 L96 256 L224 224 Z"
          fill="url(#gold)" stroke="#FFEFD0" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>

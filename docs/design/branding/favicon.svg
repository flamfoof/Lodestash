<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Lodestash">
  <!-- Favicon: bolder star, no fine detail, so it reads at 16px. -->
  <defs>
    <linearGradient id="bg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20283A"/><stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="gold" x1="256" y1="72" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7B0"/><stop offset="1" stop-color="#E0A94E"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <path d="M256 72 L294 218 L440 256 L294 294 L256 440 L218 294 L72 256 L218 218 Z" fill="url(#gold)"/>
  </g>
</svg>

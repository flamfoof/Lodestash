[package]
name = "lodestash-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Loopback HTTP/JSON API (/v1/) over axum — 1:1 with the MCP surface"

[dependencies]
lodestash-core = { workspace = true }
# The export sandbox rule (`export::check_dest`), shared with the engine's writer. The adapter
# depends on the service, never the reverse (v2 spec §3).
lodestash-engine = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tracing        = { workspace = true }
tokio          = { workspace = true }
axum           = { workspace = true }
uuid           = { workspace = true }
blake3         = { workspace = true }
dirs           = { workspace = true }

[dev-dependencies]
tower    = { workspace = true }
tempfile = { workspace = true }
# Fixtures only: a test seeds a catalog file directly, since `Catalog::conn` is crate-private.
rusqlite = { workspace = true }
# Parity tests only (tests/protocol_*.rs): today's router against the v2 operation catalog.
lodestash-protocol = { workspace = true }

[package]
name = "lodestash-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Loopback HTTP/JSON API (/v1/) over axum — 1:1 with the MCP surface"

[dependencies]
lodestash-core = { workspace = true }
# The export sandbox rule (`export::check_dest`), shared with the engine's writer. The adapter
# depends on the service, never the reverse (v2 spec §3).
lodestash-engine = { workspace = true }
# The operation catalog. The allow-list gate finds a request's tool in it (`routes::operation_for`)
# instead of keeping a list of its own; the router itself is derived from it in v2 plan P3. No new
# crate in the tree: the engine already links it.
lodestash-protocol = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
tracing        = { workspace = true }
tokio          = { workspace = true }
axum           = { workspace = true }
uuid           = { workspace = true }
blake3         = { workspace = true }
dirs           = { workspace = true }

[dev-dependencies]
tower    = { workspace = true }
tempfile = { workspace = true }
# Fixtures only: a test seeds a catalog file directly, since `Catalog::conn` is crate-private.
rusqlite = { workspace = true }

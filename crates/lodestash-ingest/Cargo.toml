[package]
name = "lodestash-ingest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "File crawling, format detection, Unity package ingestion, and thumbnailing"

[dependencies]
lodestash-core = { workspace = true }
tracing        = { workspace = true }
blake3         = { workspace = true }
ufbx           = { workspace = true }
# glTF/GLB geometry for multiview embedding renders (data-only loader, no GPU).
three-d-asset  = { workspace = true }

walkdir    = { workspace = true }
image      = { workspace = true }
image_dds  = { workspace = true }
psd        = { workspace = true }
flate2     = { workspace = true }
tar        = { workspace = true }
serde_yaml = { workspace = true }
# Pack metadata: UPM `package.json` embedded in a .unitypackage (INGESTION §2).
serde_json = { workspace = true }
# Filesystem watch over source roots (DATA-MODEL §6).
notify     = { workspace = true }

# Added later in P2:
# image_dds = "0.7" # DDS/BCn textures

# Rasterises a stored preview SVG for renderers with no SVG support (the egui grid); a webview
# renders it natively and needs none of this. Already in the tree via egui_extras' svg feature.
resvg = "0.37"

[dev-dependencies]
tempfile = { workspace = true }
insta    = { workspace = true }

[package]
name        = "lodestash-app"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }

[dependencies]
# Headless desktop orchestration: everything the app does that is not drawing. Consumed by the
# egui shell today and by the Tauri backend once the port lands, so it must never gain a UI dep.
lodestash-core   = { workspace = true }
lodestash-ingest = { workspace = true }
# config.rs reaches for the cloud provider's default base URL and the agent operation
# allow-list. Neither crate depends back on this one, so the graph stays acyclic.
lodestash-ai     = { workspace = true }
lodestash-api    = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
tracing          = { workspace = true }
# Model artifact downloads (SigLIP / CLAP / ONNX Runtime): HTTP + zip extraction.
ureq             = { workspace = true }
zip              = { workspace = true }
dirs             = { workspace = true }
# Audio *decode* for the CLAP embedding drain. Playback (`AudioPlayer`) stays in the UI crate —
# its stream handle is `!Send` and belongs to whatever owns the window.
rodio            = { workspace = true }
# Thumbnail + preview raster handling in the identify drains.
image            = { workspace = true }
# Scratch pulls for in-pack identify (DATA-MODEL §7 / M14).
tempfile         = { workspace = true }

# Windows Credential Manager for the cloud API key at rest (AI-PIPELINE §5.1). Windows-only on
# purpose: the app targets win-x64, and other platforms fall back to the plaintext-config path
# (config.rs) — no dbus/secret-service pulled into the build.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

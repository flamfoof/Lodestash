[package]
name = "lodestash-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lodestash desktop shell — Tauri 2 host for the Svelte frontend"

# Named `lodestash-desktop` so it could run side by side with the egui `lodestash` binary during
# the port. That binary was deleted at the B7 cutover (2026-08-07); this is the only shell now, and
# the name stays because renaming it would break every script and shortcut pointing at it.
[[bin]]
name = "lodestash-desktop"
path = "src/main.rs"

[lib]
name = "lodestash_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Window geometry persistence: remember size/position/maximized across launches and restore
# before the window shows (no resize flash). Persists to the app config dir, keyed by window.
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# import_record batch reads + batch undo (UI-SPEC §16.1) run direct SQL against the writer's
# database path: the catalog's own connection is private to lodestash-core, and rusqlite is
# already a workspace dependency (TECH-STACK §1) — re-listed here for the shell's two queries.
rusqlite = { workspace = true }
# Catalog access. Reads come off this crate's own connection; every write goes through the one
# writer thread in `writer.rs` (ARCHITECTURE §5, single writer).
lodestash-core = { workspace = true }
lodestash-app = { workspace = true }
# Headless MCP forwards its writes to the running app over loopback (agent_bridge.rs).
ureq          = { workspace = true, features = ["json"] }
# Mesh parse + decimation for the Quick Look viewer (lodestash://mesh).
lodestash-ingest = { workspace = true }
# The agent plane (B12, ENGINE-API §1–2, MCP↔REST 1:1): the loopback REST server + the MCP
# stdio server share one `lodestash_api::ServerState` in this process. The API never writes the
# catalog (its own read-only connection; the writer keeps single-writer).
lodestash-api = { workspace = true }
lodestash-mcp = { workspace = true }
tokio = { workspace = true }
lodestash-ai = { workspace = true }

[dev-dependencies]
# Real files under a real root, for the delete fence — the guard is about paths on disk, so a
# test that fakes the filesystem would not be testing it.
tempfile = { workspace = true }

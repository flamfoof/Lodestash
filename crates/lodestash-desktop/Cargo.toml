[package]
name = "lodestash-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lodestash desktop shell — Tauri 2 host for the Svelte frontend"

# The binary is named `lodestash-desktop` until the B7 cutover, so it can be built and run
# side by side with the egui `lodestash` binary during the port.
[[bin]]
name = "lodestash-desktop"
path = "src/main.rs"

[lib]
name = "lodestash_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Read-only catalog access. The desktop shell holds its own connection and never writes:
# every write goes through the persist thread (ARCHITECTURE §5, single writer).
lodestash-core = { workspace = true }
lodestash-app = { workspace = true }

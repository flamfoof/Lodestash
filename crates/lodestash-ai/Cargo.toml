[package]
name = "lodestash-ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tagger/Embedder traits and impls (ONNX, Ollama, cloud Claude)"

[dependencies]
lodestash-core = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tokio          = { workspace = true }

# Phase 3 local embeddings (ONNX Runtime via ort; load-dynamic = dlopen at runtime,
# so the build never needs the ~200MB native binary — see TECH-STACK §7).
ort        = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
tokenizers = "0.20"
ndarray    = "0.16"

# Added in Phase 4:
# reqwest    = { version = "0.12", features = ["json", "stream"] }  # Ollama + cloud

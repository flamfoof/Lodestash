[package]
name = "lodestash-ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Tagger/Embedder traits and impls (ONNX, Ollama, cloud Claude)"

[dependencies]
lodestash-core = { workspace = true }
tracing        = { workspace = true }
tokio          = { workspace = true }

# Phase 3 local embeddings (ONNX Runtime via ort; load-dynamic = dlopen at runtime,
# so the build never needs the ~200MB native binary — see TECH-STACK §7).
ort        = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
tokenizers = "0.20"
ndarray    = "0.16"
image      = { workspace = true }

# Phase 4 tagging: Ollama over loopback HTTP. `ureq` (already used for the model downloads)
# rather than reqwest — the calls are blocking, one at a time, on the persist thread.
ureq       = { workspace = true, features = ["json"] }
serde      = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Multiview 3D embedding tests need the mesh loader + CPU renderer.
lodestash-ingest = { workspace = true }

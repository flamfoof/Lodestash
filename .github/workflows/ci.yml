name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: build + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Build (debug)
        run: cargo build --all-targets

      - name: Tests
        run: cargo test --all

  # Early warning on upcoming-Rust breakage; never blocks a PR.
  # Nightly rustfmt also honors the two nightly-only rustfmt.toml options
  # (imports_granularity / group_imports) that stable silently ignores.
  nightly:
    name: nightly toolchain (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build (debug)
        run: cargo build --all-targets

      - name: Tests
        run: cargo test --all
